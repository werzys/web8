<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Задание 8. Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <h1>Форма обратной связи</h1>
        <p>Нажмите на кнопку, чтобы написать нам сообщение.</p>
        <button type="button" id="open-btn" class="btn">Связаться с нами</button>
    </main>

    <div id="overlay" class="overlay" hidden>
        <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
            <div class="popup-head">
                <h2 id="popup-title">Напишите нам</h2>
                <button type="button" id="close-btn" class="close" aria-label="Закрыть">&times;</button>
            </div>
            <form id="feedback-form" autocomplete="on">
                <label for="fio">ФИО</label>
                <input type="text" id="fio" name="fio" required autocomplete="name">

                <div class="row">
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required autocomplete="email">
                    </div>
                    <div>
                        <label for="phone">Телефон</label>
                        <input type="tel" id="phone" name="phone" required minlength="5" autocomplete="tel">
                    </div>
                </div>

                <label for="organization">Организация</label>
                <input type="text" id="organization" name="organization" autocomplete="organization">

                <label for="message">Сообщение</label>
                <textarea id="message" name="message" rows="3" required></textarea>

                <label class="check" for="agree">
                    <input type="checkbox" id="agree" name="agree" required>
                    <span>Согласен с политикой обработки персональных данных</span>
                </label>

                <button type="submit" id="submit-btn" class="btn">Отправить</button>
                <p id="status" class="status" role="status"></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
